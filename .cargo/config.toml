# Native-target build flags for the miner crates. `target-cpu=native` lets
# blake2b_simd select AVX2/AVX-512 dispatch automatically and lets LLVM
# auto-vectorize the bucket-sort hot path.
#
# This file is *not* picked up when building the Solana program (SBF target
# uses its own toolchain), so the on-chain crate is unaffected.

[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "target-cpu=native"]

[target.x86_64-apple-darwin]
rustflags = ["-C", "target-cpu=native"]

[target.aarch64-apple-darwin]
rustflags = ["-C", "target-cpu=native"]

[target.aarch64-unknown-linux-gnu]
rustflags = ["-C", "target-cpu=native"]
